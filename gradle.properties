android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1024m

# AGP 9 only creates unit-test tasks for the tested build type (debug) by default;
# CI (build-test-auto.yml) runs testRunTestsUnitTest, so keep them for every build type.
android.onlyEnableUnitTestForTheTestedBuildType=false
